[project]
name = "bim-ai-backend"
version = "0.3.0"
description = "BIM AI platform backend (Speckle M2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.9",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "specklepy>=2.21",
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
